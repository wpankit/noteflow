<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <!-- Brand gradient: indigo -> violet -> fuchsia, matching the plugin UI -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <!-- Soft top-left sheen so the tile has depth at large sizes -->
    <radialGradient id="sheen" cx="18%" cy="12%" r="78%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile">
      <rect x="0" y="0" width="256" height="256" rx="58"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="url(#bg)"/>
    <rect width="256" height="256" fill="url(#sheen)"/>
  </g>

  <!-- Ascending bars = growth in tracked visits. Pill caps echo the UI's radii. -->
  <g fill="#ffffff">
    <rect x="48"  y="138" width="28" height="58"  rx="14"/>
    <rect x="92"  y="112" width="28" height="84"  rx="14"/>
    <rect x="136" y="86"  width="28" height="110" rx="14"/>
    <rect x="180" y="60"  width="28" height="136" rx="14"/>
  </g>

  <!-- Inner hairline keeps the tile crisp on light backgrounds -->
  <rect x="0.75" y="0.75" width="254.5" height="254.5" rx="57.25" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
</svg>
